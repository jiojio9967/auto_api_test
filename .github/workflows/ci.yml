name: Run Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest allure-pytest

      - name: 安装 Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure
          allure --version

      - name: 执行 pytest
        run: |
          pytest testcases --alluredir=./allure-results

      - name: 生成 Allure 报告
        if: always()
        run: |
          allure generate ./allure-results -o ./allure-report --clean

      - name: 上传 Allure 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./allure-report

      - name: 发布 Allure 报告到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 输出 Allure 报告地址
        run: |
          echo "Allure 报告地址：${{ steps.deployment.outputs.page_url }}"
          echo "### Allure 报告" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[打开 Allure 报告](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"